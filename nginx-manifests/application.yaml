apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
 name: nginx-app
 namespace: argocd
spec:
 project: default
 source:
   repoURL: https://github.com/rshihengyi/AWS-Kubernetes-Platform_GitOps.git
   targetRevision: main
   path: nginx-manifests
 destination:
   server: https://kubernetes.default.svc
   namespace: default
 syncPolicy:
   automated:
     prune: true
     selfHeal: true
